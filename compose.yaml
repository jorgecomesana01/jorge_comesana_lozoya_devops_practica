services:
    api:
        build: .
        image: tienda-api:1.0
        ports: 
            - "${PUERTO:-8000}:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
        restart: unless-stopped
    frontend:
        build: ./frontend_streamlit
        image: tienda-frontend:1.0
        ports: 
            - "${PUERTO_FRONTEND:-8501}:8501"
        environment:
            TIENDA_API_URL: http://api:8000
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped
    cliente:
        build: ./cliente_python
        image: tienda-cliente:1.0
        command: ["python", "cliente.py", "http://api:8000"]
        depends_on:
            api:
                condition: service_healthy
        profiles: ["cliente"]